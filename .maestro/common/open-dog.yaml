# Vom Startbildschirm ins Profil des Testhundes (Name über DOG_NAME, Standard «Testhund»).
appId: com.anyvo.app
env:
  DOG_NAME: ${DOG_NAME || 'Testhund'}
---
- tapOn: "(?-i)Hunde(, tab.*)?"
- assertVisible: "Mit mir geteilt"
# iOS hängt nach dem ersten Training «, Letztes Training: …» an das Label der Zeile.
- tapOn: "${DOG_NAME}(, .*)?"
- runFlow: dismiss-help.yaml
- assertVisible: ".*Gesundheitsakte.*"
