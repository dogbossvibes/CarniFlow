# Einen Schritt zurück: Android über die Systemtaste, iOS über die Wischgeste vom linken Rand.
appId: com.anyvo.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "85%, 50%"
          duration: 300
