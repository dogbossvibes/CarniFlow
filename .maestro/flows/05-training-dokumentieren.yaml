# Training nachträglich dokumentieren: Formular öffnen, Übung wählen, speichern.
# Die Einheit bekommt eine Kennnotiz und wird am Ende über das Trainingsjournal
# wieder gelöscht, damit sich beim Testhund keine Einheiten ansammeln.
appId: com.anyvo.app
env:
  E2E_NOTE: "E2E Maestro Training"
---
- runFlow: ../common/start.yaml
- tapOn: "(?-i)Training(, tab.*)?"
- tapOn: ".*Training dokumentieren.*"
- runFlow: ../common/dismiss-help.yaml
- assertVisible: "Training erfassen"
- assertVisible: "Heute trainiert"
# Ein wiederhergestellter Entwurf hat die Übung schon gewählt (dann steht «Weitere Übung auswählen»).
- runFlow:
    when:
      visible: "Übung auswählen"
    commands:
      # Der Knopf klappt die Übungsliste auf und zu. Direkt nach dem Öffnen des
      # Formulars bleibt sie auf Android nicht immer offen: tippen, bis die
      # Listenüberschrift («ÜBUNGEN · <Sparte>») steht.
      - repeat:
          times: 4
          while:
            notVisible: "Übungen · .*"
          commands:
            - waitForAnimationToEnd
            - tapOn: "Übung auswählen"
            - waitForAnimationToEnd
      - assertVisible: "Übungen · .*"
      # Lädt die Übungsliste nicht, sind die Übungen gesperrt und es kann nicht gespeichert werden.
      - assertNotVisible: "Historie nicht verfügbar.*"
      # Die Karte «Letztes Mal» zeigt denselben Übungsnamen: die Zeile in der Übungsliste wählen.
      - tapOn:
          text: "Allgemeines Training"
          below: "Übungen · .*"
# Kennnotiz in die allgemeine Trainingsnotiz (liegt unter den optionalen Angaben).
# Zentrieren gelingt auf iOS nicht (Zeile steht schon am Listenende) – darum
# optional, die Sichtbarkeit prüft der nächste Schritt.
- scrollUntilVisible:
    element: "Dauer, Datum & weitere Angaben.*"
    direction: DOWN
    centerElement: true
    optional: true
- assertVisible: "Dauer, Datum & weitere Angaben.*"
- runFlow:
    when:
      notVisible: "Allgemeine Trainingsnotiz.*"
    commands:
      - tapOn: "Dauer, Datum & weitere Angaben.*"
- scrollUntilVisible:
    element: "Was lief gut\\? Was möchtest du nächstes Mal verbessern\\?"
    direction: DOWN
    centerElement: true
    optional: true
- tapOn: "Was lief gut\\? Was möchtest du nächstes Mal verbessern\\?"
- inputText: ${E2E_NOTE}
- runFlow: ../common/hide-keyboard.yaml
- scrollUntilVisible:
    element: ".*Einheit speichern"
    direction: DOWN
- assertNotVisible: "Wähle mindestens eine Übung, um zu speichern"
- tapOn: ".*Einheit speichern"
- extendedWaitUntil:
    notVisible: ".*Einheit speichern"
    timeout: 20000
# Aufräumen: die eben gespeicherte Einheit im Trainingsjournal suchen und löschen.
- runFlow: ../common/start.yaml
- tapOn: "(?-i)Training(, tab.*)?"
- tapOn: ".*Trainingsjournal.*"
- runFlow: ../common/dismiss-help.yaml
- tapOn: "Suchen"
- inputText: ${E2E_NOTE}
- runFlow: ../common/hide-keyboard.yaml
# Die Suche zeigt nur noch Einheiten mit der Kennnotiz. Die Karte wird über die
# Zeile «Hund · Datum» angesteuert: Android liefert die Notiz als eigenen Text
# (wie das Suchfeld), iOS fasst die Karte zu einem Label ohne Notiz zusammen.
- assertVisible: ".*Testhund · .*"
- repeat:
    times: 5
    while:
      visible: ".*Testhund · .*"
    commands:
      - longPressOn:
          text: ".*Testhund · .*"
          index: 0
      # Ein Fehlerbanner des Entwicklungsmodus läge über «Löschen».
      - runFlow: ../common/dismiss-logbox.yaml
      # iOS stellt dem Menüpunkt das Symbolzeichen voran («…, Löschen»).
      - tapOn: "(.+, )?Löschen"
      - assertVisible: "Training löschen\\?"
      - tapOn: "Löschen"
      - waitForAnimationToEnd
- assertVisible: "Keine passenden Trainings gefunden"
